[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-log-analyzer"
version = "0.1.0"
description = "把 STM32 串口日志变成一张能读的汇总表"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Steve-Kara" }]
keywords = ["stm32", "serial", "log", "cli"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sla = "serial_log_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
